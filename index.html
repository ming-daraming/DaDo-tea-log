<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>다도 기록장</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700&family=Gaegu:wght@400;700&family=Yeon+Sung&family=Gamja+Flower&family=Dokdo&family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root{
    --bg:#f6f3ee;
    --card:#ffffff;
    --border:#e2ddd2;
    --border-strong:#c9c1b0;
    --text:#2c2a24;
    --text-sub:#797365;
    --text-muted:#a39c8c;
    --accent:#6b7a4f;
    --accent-bg:#eef1e6;
    --accent-text:#4a5636;
    --danger:#b5533f;
    --radius:10px;
    --font-main:"Noto Sans KR", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  *{box-sizing:border-box; min-width:0;}
  body{
    margin:0;
    font-family:var(--font-main);
    background:var(--bg);
    color:var(--text);
    padding-bottom:60px;
  }
  header{
    padding:20px 16px 12px;
    text-align:center;
  }
  header h1{
    font-size:19px;
    font-weight:600;
    margin:0 0 2px;
  }
  header p{
    font-size:12px;
    color:var(--text-sub);
    margin:0;
  }
  .wrap{
    max-width:480px;
    margin:0 auto;
    padding:0 14px;
  }
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:16px;
    margin-bottom:16px;
  }
  .section-title{
    font-size:13px;
    font-weight:600;
    color:var(--text-sub);
    margin:0 0 10px;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .row{
    display:grid;
    grid-template-columns:1fr;
    gap:10px;
    margin-bottom:12px;
  }
  .row.two{
    grid-template-columns:minmax(0,1fr) minmax(0,1fr);
  }
  label{
    font-size:12px;
    color:var(--text-muted);
    display:block;
    margin-bottom:4px;
  }
  input[type=text], input[type=date], select, textarea, button{
    width:100%;
    max-width:100%;
    height:38px;
    border:1px solid var(--border-strong);
    border-radius:8px;
    padding:0 10px;
    font-size:14px;
    background:#fff;
    color:var(--text);
    font-family:inherit;
  }
  textarea{
    height:70px;
    padding:8px 10px;
    resize:vertical;
  }
  select{
    appearance:none;
    -webkit-appearance:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%23797365' stroke-width='2'><polyline points='6 9 12 15 18 9'/></svg>");
    background-repeat:no-repeat;
    background-position:right 10px center;
    padding-right:28px;
  }
  input[type=date]{
    appearance:none;
    -webkit-appearance:none;
    font-size:13.5px;
  }
  input[type=date]::-webkit-datetime-edit{
    padding:0;
  }
  input[type=date]::-webkit-calendar-picker-indicator{
    margin-left:2px;
    padding:2px;
  }
  .chip-group{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
  }
  .chip{
    position:relative;
  }
  .chip input{
    position:absolute;
    opacity:0;
    width:100%;
    height:100%;
    margin:0;
    cursor:pointer;
  }
  .chip span{
    display:inline-block;
    padding:6px 12px;
    font-size:12.5px;
    border:1px solid var(--border-strong);
    border-radius:20px;
    color:var(--text-sub);
    background:#fff;
    transition:.12s;
  }
  .chip input:checked + span{
    background:var(--accent-bg);
    border-color:var(--accent);
    color:var(--accent-text);
    font-weight:600;
  }
  .slider-row{
    display:flex;
    align-items:center;
    gap:10px;
  }
  input[type=range]{
    flex:1;
    height:4px;
    -webkit-appearance:none;
    appearance:none;
    border-radius:4px;
    outline:none;
    padding:0;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;
    appearance:none;
    width:16px;
    height:16px;
    border-radius:50%;
    background:var(--accent);
    border:2px solid #fff;
    box-shadow:0 0 0 1px var(--accent);
    cursor:pointer;
  }
  input[type=range]::-moz-range-thumb{
    width:16px;
    height:16px;
    border-radius:50%;
    background:var(--accent);
    border:2px solid #fff;
    box-shadow:0 0 0 1px var(--accent);
    cursor:pointer;
  }
  input[type=range]::-moz-range-track{
    height:4px;
    border-radius:4px;
    background:transparent;
  }
  .slider-val{
    font-size:13px;
    font-weight:600;
    min-width:16px;
    text-align:center;
    color:var(--accent-text);
  }
  .divider{
    border-top:1px solid var(--border);
    margin:14px 0;
  }
  button.save{
    width:100%;
    height:44px;
    border:none;
    border-radius:10px;
    background:var(--accent);
    color:#fff;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
  }
  button.save:active{opacity:.85;}
  .entry-filter{
    display:flex;
    gap:8px;
    margin-bottom:12px;
    align-items:center;
  }
  .entry-filter select{
    height:34px;
    font-size:13px;
  }
  .entry{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:12px;
    padding:14px;
    margin-bottom:10px;
  }
  .entry-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    margin-bottom:8px;
  }
  .entry-title{
    font-size:14.5px;
    font-weight:600;
  }
  .entry-sub{
    font-size:12px;
    color:var(--text-muted);
    margin-top:2px;
  }
  .entry-user{
    font-size:11px;
    background:var(--accent-bg);
    color:var(--accent-text);
    padding:2px 8px;
    border-radius:10px;
    font-weight:600;
    white-space:nowrap;
  }
  .entry-tags{
    display:flex;
    flex-wrap:wrap;
    gap:5px;
    margin:6px 0;
  }
  .tag{
    font-size:11px;
    padding:3px 8px;
    border-radius:20px;
    background:#f1efe8;
    color:var(--text-sub);
  }
  .entry-grid{
    font-size:12.5px;
    color:var(--text-sub);
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:4px 10px;
    margin:8px 0;
  }
  .entry-grid b{
    color:var(--text);
    font-weight:600;
  }
  .entry-note{
    font-size:13px;
    color:var(--text);
    margin-top:6px;
    white-space:pre-wrap;
    line-height:1.5;
  }
  .del-btn{
    border:none;
    background:none;
    color:var(--text-muted);
    font-size:12px;
    cursor:pointer;
    padding:4px;
  }
  .del-btn:active{color:var(--danger);}
  .empty{
    text-align:center;
    color:var(--text-muted);
    font-size:13px;
    padding:30px 0;
  }
  .err{
    color:var(--danger);
    font-size:12px;
    margin-top:-4px;
    margin-bottom:10px;
    display:none;
  }
  .color-swatches{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:10px;
  }
  .swatch{
    width:22px;
    height:22px;
    border-radius:50%;
    border:2px solid #fff;
    outline:1px solid var(--border-strong);
    cursor:pointer;
    padding:0;
  }
  .swatch.selected{
    outline:2px solid var(--accent);
    box-shadow:0 0 0 2px var(--accent-bg);
  }
  .color-custom-row{
    display:flex;
    gap:8px;
    align-items:center;
  }
  .color-picker-wrap{
    position:relative;
    width:56px;
    height:56px;
    flex:none;
  }
  .color-preview{
    position:absolute;
    inset:0;
    border-radius:50%;
    outline:1px solid var(--border-strong);
    pointer-events:none;
  }
  .color-picker-wrap input[type=color]{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    padding:0;
    border:none;
    opacity:0;
    cursor:pointer;
  }
  .color-custom-row input[type=text]{
    flex:1;
  }
  .color-dot{
    display:inline-block;
    width:10px;
    height:10px;
    border-radius:50%;
    margin-right:5px;
    vertical-align:middle;
    outline:1px solid rgba(0,0,0,.1);
  }
  .capture-btn{
    width:100%;
    height:40px;
    border:1px solid var(--border-strong);
    border-radius:10px;
    background:#fff;
    color:var(--text-sub);
    font-size:13.5px;
    font-weight:600;
    cursor:pointer;
    margin-bottom:16px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
  }
  .capture-btn:active{opacity:.8;}
  .heart-row{
    display:flex;
    gap:4px;
    margin-bottom:12px;
  }
  .heart{
    font-size:26px;
    line-height:1;
    cursor:pointer;
    color:var(--border-strong);
    user-select:none;
    transition:.1s;
  }
  .heart.filled{
    color:var(--danger);
  }
  .entry-hearts{
    font-size:13px;
    color:var(--danger);
    margin:2px 0;
  }
  .toast{
    position:fixed;
    left:50%;
    bottom:24px;
    transform:translateX(-50%);
    background:var(--text);
    color:#fff;
    font-size:13px;
    padding:10px 18px;
    border-radius:20px;
    opacity:0;
    pointer-events:none;
    transition:opacity .25s;
    z-index:50;
  }
  .toast.show{opacity:1;}
</style>
</head>
<body>

<header>
  <h1>🍵 다도 기록장</h1>
  <p>매번 우린 차의 인상을 기록해요</p>
</header>

<div class="wrap">
  <div id="capture-area">
  <div class="card" style="padding:12px 14px;">
    <label style="margin-bottom:6px;">글꼴</label>
    <select id="font-select" style="font-size:15px;">
      <option value="'Noto Sans KR', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" style="font-family:'Noto Sans KR', sans-serif;">기본체</option>
      <option value="'Gaegu', var(--font-main)" style="font-family:'Gaegu', sans-serif;">개구쟁이체</option>
      <option value="'Yeon Sung', var(--font-main)" style="font-family:'Yeon Sung', sans-serif;">연성체</option>
      <option value="'Gamja Flower', var(--font-main)" style="font-family:'Gamja Flower', sans-serif;">감자꽃체</option>
      <option value="'Dokdo', var(--font-main)" style="font-family:'Dokdo', sans-serif;">독도체</option>
      <option value="'Gowun Batang', var(--font-main)" style="font-family:'Gowun Batang', serif;">고운바탕체</option>
    </select>
  </div>

  <div class="card">
    <p class="section-title">기본 정보</p>
    <div class="row two">
      <div>
        <label>작성자</label>
        <input type="text" id="f-user" placeholder="이름 또는 닉네임">
      </div>
      <div>
        <label>날짜</label>
        <input type="date" id="f-date">
      </div>
    </div>
    <div class="row two">
      <div>
        <label>차 종류</label>
        <select id="f-type">
          <option value="">선택</option>
          <option>녹차</option>
          <option>백차</option>
          <option>황차</option>
          <option>청차(우롱차)</option>
          <option>홍차</option>
          <option>흑차(보이차)</option>
          <option>화차</option>
          <option>기타</option>
        </select>
      </div>
      <div>
        <label>차 브랜드</label>
        <input type="text" id="f-brand" placeholder="예: OO다원">
      </div>
    </div>
    <div class="err" id="err-basic">작성자, 날짜, 차 종류는 필수예요.</div>
  </div>

  <div class="card">
    <p class="section-title">탕색</p>
    <div class="row">
      <div>
        <div class="color-swatches" id="color-swatches"></div>
        <div class="color-custom-row">
          <div class="color-picker-wrap">
            <div class="color-preview" id="f-color-preview"></div>
            <input type="color" id="f-color-picker" value="#e8b04b">
          </div>
          <input type="text" id="f-color-label" placeholder="색상 이름 (예: 밝은 등황색)">
        </div>
      </div>
    </div>

    <div class="divider"></div>

    <p class="section-title">엽저</p>
    <input type="text" id="f-yeopjeo" placeholder="예: 균일한 갈색">
  </div>

  <div class="card">
    <p class="section-title">향 (다중 선택)</p>
    <div class="chip-group" id="group-aroma">
      <label class="chip"><input type="checkbox" value="청향"><span>청향</span></label>
      <label class="chip"><input type="checkbox" value="밀향"><span>밀향</span></label>
      <label class="chip"><input type="checkbox" value="화향"><span>화향</span></label>
      <label class="chip"><input type="checkbox" value="과소향"><span>과소향</span></label>
      <label class="chip"><input type="checkbox" value="연향"><span>연향</span></label>
      <label class="chip"><input type="checkbox" value="침향"><span>침향</span></label>
      <label class="chip"><input type="checkbox" value="당향"><span>당향</span></label>
      <label class="chip"><input type="checkbox" value="초당향"><span>초당향</span></label>
      <label class="chip"><input type="checkbox" value="진향"><span>진향</span></label>
    </div>

    <div class="divider"></div>

    <p class="section-title">향 지속성</p>
    <div class="slider-row">
      <input type="range" id="f-aroma-persistence" min="1" max="5" step="1" value="1">
      <span class="slider-val" id="f-aroma-persistence-val">1</span>
    </div>

    <div class="divider"></div>

    <p class="section-title">맛 (다중 선택)</p>
    <div class="chip-group" id="group-taste">
      <label class="chip"><input type="checkbox" value="단맛"><span>단맛</span></label>
      <label class="chip"><input type="checkbox" value="쓴맛"><span>쓴맛</span></label>
      <label class="chip"><input type="checkbox" value="신맛"><span>신맛</span></label>
      <label class="chip"><input type="checkbox" value="감칠맛"><span>감칠맛</span></label>
    </div>

    <div class="divider"></div>

    <p class="section-title">질감</p>
    <input type="text" id="f-texture" placeholder="예: 부드러움">

    <div class="divider"></div>

    <p class="section-title">여운(회감)</p>
    <input type="text" id="f-aftertaste" placeholder="예: 오래 지속됨">

    <div class="divider"></div>

    <p class="section-title">떫은 정도</p>
    <div class="slider-row">
      <input type="range" id="f-astringency" min="1" max="5" step="1" value="1">
      <span class="slider-val" id="f-astringency-val">1</span>
    </div>
  </div>

  <div class="card">
    <p class="section-title">총평 / 메모</p>
    <label style="margin-bottom:6px;">별점</label>
    <div class="heart-row" id="rating-row">
      <span class="heart" data-val="1">♥</span>
      <span class="heart" data-val="2">♥</span>
      <span class="heart" data-val="3">♥</span>
      <span class="heart" data-val="4">♥</span>
      <span class="heart" data-val="5">♥</span>
    </div>
    <textarea id="f-note" placeholder="전반적인 인상, 재구매 의사 등"></textarea>
  </div>
  </div>

  <button class="capture-btn" id="btn-capture">📷 작성 화면 캡처하기</button>
  <button class="save" id="btn-save">기록 저장하기</button>

  <div class="divider" style="margin-top:22px;"></div>

  <div style="display:flex; justify-content:space-between; align-items:center; margin:18px 0 10px;">
    <p class="section-title" style="margin:0;">지난 기록</p>
    <select id="filter-user" style="width:130px;">
      <option value="all">전체 보기</option>
    </select>
  </div>

  <div id="entry-list"></div>

</div>

<div class="toast" id="toast"></div>

<script>
const STORAGE_KEY = 'tea-log-entries-v1';

function loadEntries(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : [];
  }catch(e){
    return [];
  }
}
function saveEntries(entries){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
}

document.getElementById('f-date').valueAsDate = new Date();

const FONT_KEY = 'tea-log-font-v1';
const fontSelect = document.getElementById('font-select');
const savedFont = localStorage.getItem(FONT_KEY);
if(savedFont){
  document.documentElement.style.setProperty('--font-main', savedFont);
  fontSelect.value = savedFont;
}
fontSelect.addEventListener('change', ()=>{
  document.documentElement.style.setProperty('--font-main', fontSelect.value);
  localStorage.setItem(FONT_KEY, fontSelect.value);
});

// html2canvas can't rasterize the native range thumb/track, so we paint the
// filled portion ourselves via a background gradient on the element.
const RANGE_FILL = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#6b7a4f';
const RANGE_TRACK = getComputedStyle(document.documentElement).getPropertyValue('--border-strong').trim() || '#c9c1b0';
function updateRangeFill(input){
  const min = Number(input.min || 0);
  const max = Number(input.max || 100);
  const pct = max > min ? ((Number(input.value) - min) / (max - min)) * 100 : 0;
  input.style.background = `linear-gradient(to right, ${RANGE_FILL} 0%, ${RANGE_FILL} ${pct}%, ${RANGE_TRACK} ${pct}%, ${RANGE_TRACK} 100%)`;
}

const astSlider = document.getElementById('f-astringency');
const astVal = document.getElementById('f-astringency-val');
astSlider.addEventListener('input', ()=>{
  astVal.textContent = astSlider.value;
  updateRangeFill(astSlider);
});
updateRangeFill(astSlider);

const aromaPersistSlider = document.getElementById('f-aroma-persistence');
const aromaPersistVal = document.getElementById('f-aroma-persistence-val');
aromaPersistSlider.addEventListener('input', ()=>{
  aromaPersistVal.textContent = aromaPersistSlider.value;
  updateRangeFill(aromaPersistSlider);
});
updateRangeFill(aromaPersistSlider);

// ---- 탕색 팔레트 ----
const COLOR_PRESETS = [
  {name:'연한 미황색', hex:'#f4ecc8'},
  {name:'밝은 등황색', hex:'#e8b04b'},
  {name:'진한 황금색', hex:'#d69a1f'},
  {name:'귤색', hex:'#e07a2c'},
  {name:'적갈색', hex:'#a85a2b'},
  {name:'진한 홍색', hex:'#8c3b2e'},
  {name:'밤색(흑차)', hex:'#5c3a21'},
  {name:'연두빛 녹색', hex:'#a9b96a'}
];
const swatchWrap = document.getElementById('color-swatches');
const colorPicker = document.getElementById('f-color-picker');
const colorLabel = document.getElementById('f-color-label');
const colorPreview = document.getElementById('f-color-preview');
function setColorPreview(hex){ colorPreview.style.background = hex; }
setColorPreview(colorPicker.value);

COLOR_PRESETS.forEach(c=>{
  const b = document.createElement('button');
  b.type = 'button';
  b.className = 'swatch';
  b.style.background = c.hex;
  b.title = c.name;
  b.dataset.hex = c.hex;
  b.dataset.name = c.name;
  b.addEventListener('click', ()=>{
    colorPicker.value = c.hex;
    colorLabel.value = c.name;
    highlightSwatch(c.hex);
    setColorPreview(c.hex);
  });
  swatchWrap.appendChild(b);
});
function highlightSwatch(hex){
  document.querySelectorAll('.swatch').forEach(s=>{
    s.classList.toggle('selected', s.dataset.hex.toLowerCase() === hex.toLowerCase());
  });
}
colorPicker.addEventListener('input', ()=>{
  highlightSwatch(colorPicker.value);
  setColorPreview(colorPicker.value);
});

// ---- 별점(하트) ----
let currentRating = 0;
const heartEls = Array.from(document.querySelectorAll('#rating-row .heart'));
function renderHearts(val){
  heartEls.forEach(h => h.classList.toggle('filled', Number(h.dataset.val) <= val));
}
heartEls.forEach(h=>{
  h.addEventListener('click', ()=>{
    const v = Number(h.dataset.val);
    currentRating = (currentRating === v) ? 0 : v;
    renderHearts(currentRating);
  });
});

// ---- 캡처 ----
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=> t.classList.remove('show'), 1800);
}
document.getElementById('btn-capture').addEventListener('click', ()=>{
  const target = document.getElementById('capture-area');
  if(typeof html2canvas === 'undefined'){
    showToast('캡처 기능을 불러오지 못했어요. 인터넷 연결을 확인해주세요.');
    return;
  }
  const isIOS = /iP(hone|ad|od)/.test(navigator.userAgent) ||
    (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  // iOS Safari blocks window.open() unless it happens synchronously inside
  // the click handler, so open a blank tab now and fill it in once ready.
  const iosTab = isIOS ? window.open('', '_blank') : null;
  html2canvas(target, {backgroundColor:'#f6f3ee', scale:2}).then(canvas=>{
    canvas.toBlob(blob=>{
      if(!blob){
        if(iosTab) iosTab.close();
        showToast('캡처에 실패했어요. 다시 시도해주세요.');
        return;
      }
      const url = URL.createObjectURL(blob);
      if(isIOS){
        if(iosTab){
          iosTab.location.href = url;
          showToast('새 탭에 이미지가 열렸어요. 길게 눌러 저장해주세요 🍵');
        }else{
          showToast('팝업이 차단됐어요. 팝업 허용 후 다시 시도해주세요.');
        }
      }else{
        const stamp = new Date().toISOString().slice(0,10);
        const link = document.createElement('a');
        link.download = `다도기록_${stamp}.png`;
        link.href = url;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        showToast('캡처 이미지가 저장됐어요 🍵');
      }
      setTimeout(()=> URL.revokeObjectURL(url), 10000);
    }, 'image/png');
  }).catch(err=>{
    if(iosTab) iosTab.close();
    console.error('capture failed', err);
    showToast('캡처에 실패했어요. 다시 시도해주세요.');
  });
});

function getChecked(groupId){
  return Array.from(document.querySelectorAll('#' + groupId + ' input:checked')).map(i => i.value);
}

function resetForm(){
  document.getElementById('f-brand').value = '';
  document.getElementById('f-type').value = '';
  colorPicker.value = '#e8b04b';
  colorLabel.value = '';
  highlightSwatch('');
  setColorPreview('#e8b04b');
  document.getElementById('f-yeopjeo').value = '';
  document.getElementById('f-texture').value = '';
  document.getElementById('f-aftertaste').value = '';
  document.getElementById('f-note').value = '';
  astSlider.value = 1;
  astVal.textContent = '1';
  updateRangeFill(astSlider);
  aromaPersistSlider.value = 1;
  aromaPersistVal.textContent = '1';
  updateRangeFill(aromaPersistSlider);
  currentRating = 0;
  renderHearts(0);
  document.querySelectorAll('#group-aroma input, #group-taste input').forEach(i => i.checked = false);
}

document.getElementById('btn-save').addEventListener('click', ()=>{
  const user = document.getElementById('f-user').value.trim();
  const date = document.getElementById('f-date').value;
  const type = document.getElementById('f-type').value;
  const errBox = document.getElementById('err-basic');

  if(!user || !date || !type){
    errBox.style.display = 'block';
    return;
  }
  errBox.style.display = 'none';

  const entry = {
    id: Date.now().toString(36) + Math.random().toString(36).slice(2,7),
    user, date, type,
    brand: document.getElementById('f-brand').value.trim(),
    aroma: getChecked('group-aroma'),
    aromaPersistence: aromaPersistSlider.value,
    taste: getChecked('group-taste'),
    colorHex: colorPicker.value,
    colorLabel: colorLabel.value.trim(),
    yeopjeo: document.getElementById('f-yeopjeo').value.trim(),
    texture: document.getElementById('f-texture').value.trim(),
    aftertaste: document.getElementById('f-aftertaste').value.trim(),
    astringency: astSlider.value,
    rating: currentRating,
    note: document.getElementById('f-note').value.trim(),
    createdAt: new Date().toISOString()
  };

  const entries = loadEntries();
  entries.unshift(entry);
  saveEntries(entries);
  resetForm();
  renderAll();
  window.scrollTo({top: document.body.scrollHeight, behavior:'smooth'});
});

function updateUserFilter(entries){
  const sel = document.getElementById('filter-user');
  const current = sel.value;
  const users = Array.from(new Set(entries.map(e => e.user))).sort();
  sel.innerHTML = '<option value="all">전체 보기</option>' +
    users.map(u => `<option value="${escapeHtml(u)}">${escapeHtml(u)}</option>`).join('');
  if(users.includes(current)) sel.value = current;
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}

function renderEntries(){
  const entries = loadEntries();
  const filter = document.getElementById('filter-user').value;
  const list = document.getElementById('entry-list');
  const filtered = filter === 'all' ? entries : entries.filter(e => e.user === filter);

  if(filtered.length === 0){
    list.innerHTML = '<div class="empty">아직 기록이 없어요. 위에서 첫 기록을 남겨보세요.</div>';
    return;
  }

  list.innerHTML = filtered.map(e => {
    const tags = [...e.aroma.map(a=>`<span class="tag">${escapeHtml(a)}</span>`),
                  ...e.taste.map(t=>`<span class="tag">${escapeHtml(t)}</span>`)].join('');
    const titleParts = [e.type, e.brand].filter(Boolean).join(' · ');
    return `
      <div class="entry">
        <div class="entry-top">
          <div>
            <div class="entry-title">${escapeHtml(titleParts)}</div>
            <div class="entry-sub">${escapeHtml(e.date)}</div>
          </div>
          <div style="display:flex; align-items:center; gap:6px;">
            <span class="entry-user">${escapeHtml(e.user)}</span>
            <button class="del-btn" onclick="deleteEntry('${e.id}')" aria-label="삭제"><i>✕</i></button>
          </div>
        </div>
        ${tags ? `<div class="entry-tags">${tags}</div>` : ''}
        <div class="entry-grid">
          ${e.colorHex || e.color ? `<div><b>탕색</b> ${e.colorHex ? `<span class="color-dot" style="background:${escapeHtml(e.colorHex)}"></span>` : ''}${escapeHtml(e.colorLabel || e.color || '')}</div>` : ''}
          ${e.yeopjeo ? `<div><b>엽저</b> ${escapeHtml(e.yeopjeo)}</div>` : ''}
          ${e.aromaPersistence ? `<div><b>향 지속성</b> ${e.aromaPersistence} / 5</div>` : ''}
          ${e.texture ? `<div><b>질감</b> ${escapeHtml(e.texture)}</div>` : ''}
          ${e.aftertaste ? `<div><b>여운</b> ${escapeHtml(e.aftertaste)}</div>` : ''}
          <div><b>떫은 정도</b> ${e.astringency} / 5</div>
        </div>
        ${e.rating ? `<div class="entry-hearts">${'♥'.repeat(Number(e.rating))}${'♡'.repeat(5-Number(e.rating))}</div>` : ''}
        ${e.note ? `<div class="entry-note">${escapeHtml(e.note)}</div>` : ''}
      </div>
    `;
  }).join('');
}

function deleteEntry(id){
  if(!confirm('이 기록을 삭제할까요?')) return;
  const entries = loadEntries().filter(e => e.id !== id);
  saveEntries(entries);
  renderAll();
}

function renderAll(){
  const entries = loadEntries();
  updateUserFilter(entries);
  renderEntries();
}

document.getElementById('filter-user').addEventListener('change', renderEntries);

renderHearts(0);
renderAll();
</script>
